[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpulease"
version = "0.2.0"
description = "GPU leases with automatic adoption of unmanaged jobs, for shared ROCm hosts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{name = "Mathew Odden", email = "modden@redhat.com"}]
keywords = ["gpu", "rocm", "amd", "scheduler", "leases", "agents", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/redhat-et/gpulease"
Issues = "https://github.com/redhat-et/gpulease/issues"

[project.scripts]
gpulease = "gpulease:main"

[tool.setuptools]
py-modules = ["gpulease"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
